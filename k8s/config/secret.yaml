# =============================================================================
# KUBERNETES SECRETS TEMPLATE (ILLUSTRATIVE PLACEHOLDER ONLY)
# STRICT SECURITY WARNING: NEVER COMMIT PRODUCTION CREDENTIALS TO VERSION CONTROL
# Apply production secrets via SealedSecrets, HashiCorp Vault, or kubectl create secret.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: foodflow-secrets
  namespace: foodflow
  labels:
    app.kubernetes.io/name: foodflow-secrets
    app.kubernetes.io/part-of: foodflow-platform
type: Opaque
stringData:
  BOOTSTRAP_POSTGRES_USER: "postgres"
  BOOTSTRAP_POSTGRES_PASSWORD: "ChangeMeClusterBootstrapPassword!"
  FOODFLOW_ADMIN_PASSWORD: "ChangeMeClusterAdminPassword!"
  FOODFLOW_PROFILE_PASSWORD: "ChangeMeClusterProfilePassword!"
  FOODFLOW_RECIPE_PASSWORD: "ChangeMeClusterRecipePassword!"
  FOODFLOW_PLANNER_PASSWORD: "ChangeMeClusterPlannerPassword!"
  PROFILE_SERVICE_DATABASE_URL: "postgresql://foodflow_profile_user:ChangeMeClusterProfilePassword!@postgres-service:5432/foodflow_db"
  RECIPE_SERVICE_DATABASE_URL: "postgresql://foodflow_recipe_user:ChangeMeClusterRecipePassword!@postgres-service:5432/foodflow_db"
  PLANNER_SERVICE_DATABASE_URL: "postgresql://foodflow_planner_user:ChangeMeClusterPlannerPassword!@postgres-service:5432/foodflow_db"

