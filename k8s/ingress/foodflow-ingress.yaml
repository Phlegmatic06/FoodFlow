apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foodflow-ingress
  namespace: foodflow
  labels:
    app.kubernetes.io/name: foodflow-ingress
    app.kubernetes.io/part-of: foodflow-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  rules:
    - http:
        paths:
          # Service 1: Profile & Nutrition Service APIs
          - path: /api/v1/biometrics
            pathType: Prefix
            backend:
              service:
                name: profile-service
                port:
                  number: 8001
          - path: /api/v1/nutrition
            pathType: Prefix
            backend:
              service:
                name: profile-service
                port:
                  number: 8001

          # Service 2: Recipe & Ingredient Service APIs
          - path: /api/v1/recipes
            pathType: Prefix
            backend:
              service:
                name: recipe-service
                port:
                  number: 8002
          - path: /api/v1/ingredients
            pathType: Prefix
            backend:
              service:
                name: recipe-service
                port:
                  number: 8002

          # Service 3: Recommendation & Meal Planner Service APIs
          - path: /api/v1/guest-sessions
            pathType: Prefix
            backend:
              service:
                name: planner-service
                port:
                  number: 8003
          - path: /api/v1/pantry
            pathType: Prefix
            backend:
              service:
                name: planner-service
                port:
                  number: 8003
          - path: /api/v1/meal-plans
            pathType: Prefix
            backend:
              service:
                name: planner-service
                port:
                  number: 8003
          - path: /api/v1/shopping-lists
            pathType: Prefix
            backend:
              service:
                name: planner-service
                port:
                  number: 8003

          # Frontend Static Web Application
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

